name: Bygg og Deploy Rekrutteringsbistand-frontend
on:
  push:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🤖
    uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v4
    with:
      baseimage: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:26
      playwright-command: 'pnpm run test'
      playwright-shards: 4
      playwright-github-report: true
      dev-vars-path: '.nais/dev-gcp.json'
      dev2-vars-path: '.nais/dev2-gcp.json'
      prod-vars-path: '.nais/prod-gcp.json'
      deploy-dev-branch: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'melding-om-nedetid' }}
      deploy-dev2-branch: 'fritekst-kandidat-forbedring'
    secrets: inherit
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
