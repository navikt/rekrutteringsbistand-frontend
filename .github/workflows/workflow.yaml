name: Bygg og Deploy Rekrutteringsbistand-frontend
on:
  push:

jobs:
  build-and-deploy:
    name: 🤖
    uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v3.6
    with:
      baseimage: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:24
      playwright-command: 'pnpm run test'
      playwright-shards: 4
      playwright-snapshots: true
      playwright-github-report: true
      dev-vars-path: '.nais/dev-gcp.json'
      dev2-vars-path: '.nais/dev2-gcp.json'
      prod-vars-path: '.nais/prod-gcp.json'
      deploy-dev-branch: 'fiks-gjenapning-av-stilling-i-sidevisning'
      deploy-dev2-branch: 'kandidat-lagretsok'
    secrets: inherit
    permissions:
      actions: write
      contents: write
      id-token: write
      pages: write
