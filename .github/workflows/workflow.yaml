name: Bygg og Deploy Rekrutteringsbistand-frontend
on:
  push:
  workflow_dispatch:
    inputs:
      kjor-chainguard-sjekk:
        description: Kjør Chainguard-sjekken før bygg og deploy
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'

jobs:
  chainguard-cron:
    if: github.event_name == 'schedule' || inputs.kjor-chainguard-sjekk
    uses: navikt/toi-frontend-workflows/.github/workflows/chainguard-cron.yaml@v2
    with:
      image: europe-north1-docker.pkg.dev/cgr-nav/pull-through/nav.no/node:24
      digest-variabel: CHAINGUARD_NODE_24_DIGEST
    permissions:
      actions: write
      id-token: write

  build-and-deploy:
    name: Next
    needs: chainguard-cron
    if: ${{ always() && (github.event_name != 'schedule' || needs.chainguard-cron.outputs.endret == 'true') }}
    uses: navikt/toi-frontend-workflows/.github/workflows/build-and-deploy-nextjs.yaml@v3
    with:
      playwright-command: 'pnpm test'
      playwright-shards: 4
      playwright-snapshots: true
      playwright-github-report: true
      a11y-command: 'pnpm a11y'
      dev-vars-path: '.nais/dev-gcp.json'
      dev2-vars-path: '.nais/dev2-gcp.json'
      prod-vars-path: '.nais/prod-gcp.json'
      deploy-dev-branch: 'brukerinstillinger-api'
      deploy-dev2-branch: 'kandidatsok-orgenhet'
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      security-events: write
      pages: write

  bekreft-chainguard-digest:
    needs: [chainguard-cron, build-and-deploy]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.kjor-chainguard-sjekk) && needs.build-and-deploy.result == 'success' }}
    uses: navikt/toi-frontend-workflows/.github/workflows/bekreft-chainguard-digest.yaml@v2
    with:
      digest: ${{ needs.chainguard-cron.outputs.digest }}
      digest-variabel: CHAINGUARD_NODE_24_DIGEST
    permissions:
      actions: write
