packages:
  - '.'

packageExtensions:
  '@navikt/browserslist-config-public@0.3.0':
    peerDependenciesMeta:
      astro:
        optional: true
      vite:
        optional: true

allowBuilds:
  '@tailwindcss/oxide': true
  msw: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 4320  # minutter (3 dager)
minimumReleaseAgeExclude:
  - '@navikt/*'
ignoreScripts: true
blockExoticSubdeps: true
registries:
  '@navikt': https://npm.pkg.github.com
